name: Transit ETL Pipeline Runner

# Controls when the workflow will run
on:
  # 1. Triggered externally by webhooks or external cron services via GitHub API:
  #    curl -X POST https://api.github.com/repos/OWNER/REPO/dispatches \
  #      -H "Accept: application/vnd.github.v3+json" \
  #      -H "Authorization: token YOUR_GITHUB_PAT" \
  #      -d '{"event_type": "trigger-etl"}'
  repository_dispatch:
    types: [trigger-etl, run-etl]

  # 2. Triggered manually from GitHub Actions UI or via workflow_dispatch API:
  workflow_dispatch:
    inputs:
      line:
        description: 'Specific rail line to ingest (e.g. mrt-kajang or all)'
        required: false
        default: 'all'

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    name: Run Transit Data Extraction & Sync

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Standalone Transit Pipeline
        env:
          INGEST_ENDPOINT: ${{ secrets.INGEST_ENDPOINT }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          python runner.py --line "${{ github.event.inputs.line || 'all' }}"
